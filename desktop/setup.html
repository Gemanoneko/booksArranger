<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"><title>Books Arranger — Choose data folder</title><link rel="stylesheet" href="setup.css"></head><body><main><h1>Choose data folder</h1><p>Use an existing catalog in its current location, or explicitly create a new catalog. Existing files and recovery stay in place.</p><fieldset><legend>Catalog</legend><label id="existing-label"><input id="existing" name="mode" type="radio" value="existing" checked> Existing folder</label><label id="new-label"><input id="new" name="mode" type="radio" value="new"> New catalog</label></fieldset><label for="folder">Data folder</label><div class="row"><input id="folder" readonly aria-describedby="help"><button id="browse">Browse…</button></div><p id="help">Select the folder containing inventory.sqlite3.</p><p id="error" role="status" aria-live="polite"></p><div class="row actions"><button id="cancel">Cancel</button><button id="accept" aria-disabled="true">Use this folder</button></div></main><script src="setup.js"></script></body></html>
